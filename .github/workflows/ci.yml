name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check backend scripts tests
      - run: python -m ruff format --check backend scripts tests
      - run: python -m mypy
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: product-frontend/package-lock.json
      - working-directory: product-frontend
        run: npm ci
      - working-directory: product-frontend
        run: npm test -- --run
      - working-directory: product-frontend
        run: npm run build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: newsrec
          POSTGRES_PASSWORD: newsrec
          POSTGRES_DB: newsrec_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U newsrec -d newsrec_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      NEWSREC_DATABASE_URL: postgresql+psycopg://newsrec:newsrec@127.0.0.1:5432/newsrec_ci_test
      NEWSREC_EVENT_MODE: sync_postgres
      NEWSREC_ALLOW_UNAUTHENTICATED_RESEARCH_API: "1"
      NEWSREC_DEFAULT_DEMO_USER_ID: "7001"
      NEWSREC_MIND_NORMALIZED_DIR: build/ci_mind_normalized
      NEWSREC_SEARCH_INDEX_DIR: build/ci_mind_search
      NEWSREC_SEARCH_RETRIEVAL_MODE: hybrid_v1
      NEWSREC_SPONSORED_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m alembic upgrade head
      - run: python scripts/build_ci_mind_fixture.py
      - run: >-
          python scripts/import_mind_catalog.py
          --normalized-root build/ci_mind_normalized
          --replace-catalog
      - run: >-
          python scripts/build_search_index.py
          --input-dir build/ci_mind_normalized
          --output-dir build/ci_mind_search
          --config evaluation/search_relevance/selected_config.json
      - run: python scripts/reset_demo_user.py --user-count 3
      - run: python scripts/seed_demo_sponsored.py
      - run: >-
          python -m pytest -q
          -m "postgres and not kafka"
          --ignore=tests/test_import_mind_catalog.py
      - name: Run local API smoke
        run: |
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > /tmp/newsrec-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python scripts/smoke_local.py --timeout-seconds 60
      - run: python -m pytest -q tests/test_import_mind_catalog.py -m postgres

  kafka-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: newsrec
          POSTGRES_PASSWORD: newsrec
          POSTGRES_DB: newsrec_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U newsrec -d newsrec_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      NEWSREC_DATABASE_URL: postgresql+psycopg://newsrec:newsrec@127.0.0.1:5432/newsrec_ci_test
      NEWSREC_KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
      NEWSREC_EVENT_MODE: kafka_async
      NEWSREC_ALLOW_UNAUTHENTICATED_RESEARCH_API: "1"
      NEWSREC_DEFAULT_DEMO_USER_ID: "7001"
      NEWSREC_MIND_NORMALIZED_DIR: build/ci_mind_normalized
      NEWSREC_SEARCH_RETRIEVAL_MODE: lexical_v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: docker compose -f docker-compose.kafka.yml up -d --wait --wait-timeout 120 kafka
      - run: docker compose -f docker-compose.kafka.yml run --rm kafka-init
      - run: python -m alembic upgrade head
      - run: python scripts/build_ci_mind_fixture.py
      - run: >-
          python scripts/import_mind_catalog.py
          --normalized-root build/ci_mind_normalized
          --replace-catalog
      - run: python scripts/reset_demo_user.py
      - run: python -m pytest -q tests/test_kafka_integration.py -m kafka
      - if: failure()
        run: docker compose -f docker-compose.kafka.yml logs --no-color
      - if: always()
        run: docker compose -f docker-compose.kafka.yml down -v
