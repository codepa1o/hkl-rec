# NewsIntentRec 工具配置。
# 此文件有意不声明 [project]：仓库以脚本形式运行，不作为包安装。
# 当共享评估代码成为正式软件包时，V2 可再添加 [project]。

# -------------------- Ruff 配置 --------------------
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    "backend/app/**/__pycache__",
    "build",
    "data",
    ".venv",
]

[tool.ruff.lint]
# 显式选择规则。避免使用 `select = ["ALL"]`，因为预览规则会产生较多噪声。
select = [
    "E",   # pycodestyle 错误
    "F",   # pyflakes 检查
    "W",   # pycodestyle 警告
    "I",   # isort
    "UP",  # pyupgrade 升级建议
    "B",   # flake8-bugbear 常见缺陷检查
    "SIM", # flake8-simplify 简化建议
    "RUF", # Ruff 专属规则
]
ignore = [
    "E501", # 行长度由格式化器而非代码检查器约束
    "B008", # 有意在默认参数中使用 FastAPI Depends()
    "RUF001", # 中文字符串会使用全角标点
    "RUF002", # 中文文档字符串会使用全角标点
    "RUF003", # 中文注释会使用全角标点
]

[tool.ruff.lint.per-file-ignores]
# 脚本属于一次性工具，允许部分风格差异。
"scripts/*.py" = ["B", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -------------------- Mypy 配置 --------------------
[tool.mypy]
python_version = "3.13"
files = ["backend/app"]
plugins = ["pydantic.mypy"]
explicit_package_bases = true
# 后端应用的严格检查设置。
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
incremental = false
exclude = [
    "^scripts/",
    "^tests/",
    "^build/",
]

# -------------------- Pytest 配置 --------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = ["-m", "not postgres"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "postgres: tests that require a running PostgreSQL NEWSREC_DATABASE_URL (skip by default).",
    "kafka: tests that require a running Kafka broker (also require PostgreSQL).",
]
